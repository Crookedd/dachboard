name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Скачиваем код Actions
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Деплой файлов на сервер через rsync
      - name: Deploy files to server
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -i ${{ secrets.SSH_KEY }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/apps/dachboard

      # 3️⃣ Собираем Docker на сервере
      - name: Build & Run Docker on server
        run: |
          ssh -o StrictHostKeyChecking=no -i ${{ secrets.SSH_KEY }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /apps/dachboard

            # Останавливаем старые контейнеры
            sudo docker-compose down || true

            # Пересобираем контейнер с нуля (Node 20)
            sudo docker-compose build --no-cache || exit 1

            # Запускаем контейнер
            sudo docker-compose up -d || exit 1

            echo "✅ Frontend deployed successfully!"
          EOF



